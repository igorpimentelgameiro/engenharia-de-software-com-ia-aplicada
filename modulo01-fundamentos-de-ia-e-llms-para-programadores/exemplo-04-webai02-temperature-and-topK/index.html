<body>
    <div class="container">
        <h1>🤖 Web AI Demo</h1>

        <form id="question-form">
            <div class="parameters">
                <div class="param-group">
                    <label for="sampling-mode">Modo de amostragem</label>
                    <select id="sampling-mode" name="samplingMode">
                        <option value="most-predictable">Muito previsível</option>
                        <option value="predictable">Previsível</option>
                        <option value="balanced" selected>Equilibrado</option>
                        <option value="creative">Criativo</option>
                        <option value="most-creative">Muito criativo</option>
                    </select>
                    <div class="param-description">
                        No Chrome 151, estes modos substituem os valores numéricos de temperature e topK em páginas web.
                    </div>
                </div>
            </div>

            <label for="question">Converse com a IA (escreva em inglês):</label>
            <textarea name="question" id="question" placeholder="Exemplo: Why is the sky blue?"></textarea>

            <button type="submit" id="ask-button">Enviar</button>
        </form>

        <div id="output"></div>

        <footer class="copyright">
            Erick Wendel - Engenharia de Software com IA Aplicada - UNIPDS - <span id="year"></span>
        </footer>
    </div>

    <script type="module" src="./index.js"></script>
