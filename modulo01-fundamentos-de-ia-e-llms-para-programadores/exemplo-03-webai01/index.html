<div id="output"></div>
<!-- https://www.jsdelivr.com/package/npm/markdown -->
<script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.min.js"></script>

<script>
    const output = document.getElementById('output');

    ; (async () => {
        let session;

        try {
            if (!('LanguageModel' in self)) {
                throw new Error('A Prompt API não está habilitada neste navegador.');
            }

            const modelOptions = {
                expectedInputs: [
                    { type: 'text', languages: ['pt'] }
                ],
                expectedOutputs: [
                    { type: 'text', languages: ['pt'] }
                ]
            };

            const availability = await LanguageModel.availability(modelOptions);
            console.log('Language Model Availability:', availability);

            if (availability !== 'available') {
                throw new Error(
                    `O modelo ainda não está pronto (${availability}). ` +
                    'O Chrome exige uma interação do usuário para iniciar o primeiro download.'
                );
            }

            output.textContent = 'Gerando resposta...';

            session = await LanguageModel.create({
                ...modelOptions,
                initialPrompts: [
                    {
                        role: 'system',
                        content: 'Você é um assistente de IA que responde de forma clara e objetiva.'
                    }
                ]
            });

            const question = 'Quem inventou o JavaScript?';
            const responseStream = session.promptStreaming(question);

            output.innerHTML = '';
            let fullText = '';

            for await (const chunk of responseStream) {
                fullText += chunk;
                output.innerHTML = markdown.toHTML(fullText);
                console.log(chunk);
            }
        } catch (error) {
            console.error(error);
            output.textContent = `Erro: ${error.message}`;
        } finally {
            session?.destroy();
        }
    })();

</script>
